name: MCP Production Smoke

# Post-deploy contract check against apex production (or a dispatched base URL).
# Asserts discovery JSON + tools/resources/prompts lists match the checked-in
# public/.well-known/mcp-server.json. Does not gate PR merges.

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to probe (no trailing slash)
        required: false
        default: https://defaultprivacy.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: MCP production smoke
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://defaultprivacy.com' }}
        run: bun run smoke:mcp:prod
