name: CI

# Formation-free hub CI: lint, build, unit tests. The v4 MCP contract job and the
# check:white-label / check:brand-voice / check:mcp-descriptions / check:citations /
# check:audiences / check:pricing / smoke:mcp guard steps were removed — those scripts
# and the /api/privacy/mcp endpoint do not exist in v5.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_URL: https://defaultprivacy.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test
