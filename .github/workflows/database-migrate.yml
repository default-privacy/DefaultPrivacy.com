# Apply Drizzle migrations against Neon from GitHub Actions (`drizzle-kit migrate`
# via scripts/run-migrations.ts — TCP by default). No Neon SQL console required.
#
# If migrate fails with "already exists" on early enums/tables, the DB was built
# without Drizzle's journal. Run once locally: `bun run db:baseline` (DATABASE_URL),
# or run `drizzle/manual_baseline_through_0018.sql` in Neon, then re-run this workflow.
#
# Setup (one time):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: DATABASE_URL
#   Value: same connection string you use in production (neon.tech URL is fine).
#
# Optional secret MIGRATE_DATABASE_URL if you use a direct (non-pooler) URL
# only for migrations; otherwise DATABASE_URL alone is enough.
#
# If migrate fails with Postgres 28P01 ("password authentication failed"):
#   1. Neon console → your project → Connection details → copy a fresh URL.
#   2. GitHub → Settings → Secrets → update DATABASE_URL (no wrapping quotes).
#   3. If MIGRATE_DATABASE_URL exists, update it too OR delete it so migrate
#      uses DATABASE_URL only (stale MIGRATE_* overrides the app secret).
#   4. Re-run this workflow (Actions → Database migrate → Run workflow).
#   Local check: `bun run db:migrate` with the same URL in .env — if local works
#   but CI fails, the Actions secret is out of date or points at another branch.
#
# Triggers:
#   - workflow_dispatch ONLY: run manually (Actions -> Database migrate -> Run workflow).
#     The push-to-main auto-trigger was intentionally REMOVED. v5 is a formation-free hub
#     whose Neon DB is managed out-of-band; auto-applying the drizzle lineage on every
#     migration/lockfile change risked recreating dropped paid/formation tables (incl. the
#     unencrypted intake PII table). Migrations here must be run manually and deliberately.

name: Database migrate

on:
  workflow_dispatch:

concurrency:
  group: database-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level env so every step (and bun) sees the same vars. Repository secret
    # name must be exactly DATABASE_URL (Actions → Secrets and variables).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Require DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$MIGRATE_DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty on the runner."
            echo "Fix: Repo **Settings → Secrets and variables → Actions** → ensure a repository secret named exactly DATABASE_URL exists (value = Neon connection string, no quotes in the value field)."
            echo "If you use an **organization** secret, open the secret in org settings and add this repository to the access list."
            exit 1
          fi
          echo "Ok: database URL secret is present (not printed)."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        env:
          DRIZZLE_USE_NEON_HTTP_MIGRATOR: "true"
        run: bun run db:migrate:ci
