  <text
    x="52"
    y="158"
    fill="#f3f6fb"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="46"
    font-weight="700"
  >Anonymous LLCs &amp;</text>
  <text
    x="52"
    y="200"
    fill="#f3f6fb"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="46"
    font-weight="700"
  >Private Business</text>
  <text
    x="52"
    y="242"
    fill="#f3f6fb"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="46"
    font-weight="700"
  >Infrastructure</text>

  <text
    x="52"
    y="296"
    fill="#a8b4c3"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="400"
