      <circle cx="0" cy="382.3" r="2.5" fill="none" stroke="#3B82F6" stroke-width="1"/>
      <circle cx="170.8" cy="0" r="2.5" fill="none" stroke="#3B82F6" stroke-width="1"/>
      <circle cx="171.4" cy="382.3" r="2.5" fill="none" stroke="#3B82F6" stroke-width="1"/>
    </g>
  </g>

  <!-- Faint large D silhouette behind rings (brand continuity) -->
  <g transform="translate(918 312) scale(1.05) translate(-190.3 -191.15)" opacity="0.07" filter="url(#ogSoftGlow)">
    <path
      d="M380.6,190.9c0,122.1-89.4,191.4-209.2,191.4H0V0h170.8C291.2,0,380.6,68.7,380.6,190.9ZM307.4,191.2c0-72.5-58.8-131.3-131.3-131.3S44.7,118.7,44.7,191.2s58.8,131.3,131.3,131.3,131.3-58.8,131.3-131.3Z"
      fill="#3B82F6"
    />
  </g>

  <rect width="1200" height="630" fill="url(#ogVignette)"/>

  <!-- Brand row: same lockup as header — /logo-icon.svg + “Default Privacy” (see header.tsx) -->
  <g transform="translate(52 36)">
    <image
