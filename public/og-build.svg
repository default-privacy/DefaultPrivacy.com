      <circle cx="176" cy="191" r="195" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4 4"/>
    </g>
    <circle cx="176.1" cy="191.2" r="131.3" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <circle cx="176.1" cy="191.2" r="87.4" fill="none" stroke="#3B82F6" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.35"/>
    <circle cx="176.1" cy="191.2" r="95" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
    <line x1="176.1" y1="0" x2="176.1" y2="382.3" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
    <line x1="0" y1="191.2" x2="380.6" y2="191.2" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
    <line x1="54" y1="69" x2="298" y2="313" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
    <line x1="298" y1="69" x2="54" y2="313" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
    <path
      d="M170.8,0H0v382.3h171.4c119.8,0,209.2-69.3,209.2-191.4S291.2,0,170.8,0ZM176.1,322.5c-72.5,0-131.3-58.8-131.3-131.3S103.6,59.8,176.1,59.8s131.3,58.8,131.3,131.3-58.8,131.3-131.3,131.3Z"
      fill="none"
      stroke="#3B82F6"
      stroke-width="1.5"
      opacity="0.6"
    />
    <g filter="url(#ogBpGlow)">
