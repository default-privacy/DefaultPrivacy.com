        fill="none"
        stroke="#3B82F6"
        stroke-width="2"
        opacity="0.85"
      />
    </g>
    <g opacity="0.25">
      <line x1="-10" y1="0" x2="30" y2="0" stroke="#3B82F6" stroke-width="0.5"/>
      <line x1="0" y1="-10" x2="0" y2="30" stroke="#3B82F6" stroke-width="0.5"/>
      <line x1="-10" y1="382.3" x2="30" y2="382.3" stroke="#3B82F6" stroke-width="0.5"/>
      <line x1="0" y1="352" x2="0" y2="392" stroke="#3B82F6" stroke-width="0.5"/>
      <line x1="370" y1="191" x2="390" y2="191" stroke="#3B82F6" stroke-width="0.5"/>
    </g>
    <g opacity="0.6">
      <circle cx="176.1" cy="59.8" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="176.1" cy="59.8" r="1.5" fill="#3B82F6"/>
      <circle cx="176.1" cy="322.5" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="176.1" cy="322.5" r="1.5" fill="#3B82F6"/>
      <circle cx="44.8" cy="191.2" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="44.8" cy="191.2" r="1.5" fill="#3B82F6"/>
      <circle cx="307.4" cy="191.2" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="307.4" cy="191.2" r="1.5" fill="#3B82F6"/>
    </g>
    <g opacity="0.4">
