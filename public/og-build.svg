      <circle cx="222.6" cy="265" r="3" fill="none" stroke="#3B82F6" stroke-width="1"/>
      <circle cx="176.1" cy="103.7" r="3" fill="none" stroke="#3B82F6" stroke-width="1"/>
      <circle cx="176.1" cy="278.6" r="3" fill="none" stroke="#3B82F6" stroke-width="1"/>
    </g>
    <g opacity="0.3">
