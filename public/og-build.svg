<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="42%" stop-color="#0c1118"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <radialGradient id="ogVignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>

    <radialGradient id="ogGlowTR" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1a9fff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ogGlowBL" cx="45%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#4db2ff" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ogCoreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ec1ff" stop-opacity="0.5"/>
      <stop offset="18%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ogReadability" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020308" stop-opacity="0.78"/>
      <stop offset="38%" stop-color="#020308" stop-opacity="0.35"/>
      <stop offset="62%" stop-color="#020308" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020308" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ogReadabilityV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020308" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020308" stop-opacity="0"/>
    </linearGradient>

    <pattern id="ogCanvasGridFine" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#3aa3ff" stroke-width="0.35" opacity="0.11"/>
    </pattern>
    <pattern id="ogCanvasGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#3B82F6" stroke-width="0.55" opacity="0.16"/>
    </pattern>

    <filter id="ogSoftGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blueprint asset (from logo-blueprint.svg), prefixed ids -->
    <filter id="ogBpGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="ogBpGrid" width="19" height="19" patternUnits="userSpaceOnUse">
      <path d="M 19 0 L 0 0 0 19" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.28"/>
    </pattern>
    <pattern id="ogBpGridFine" width="4.75" height="4.75" patternUnits="userSpaceOnUse">
      <path d="M 4.75 0 L 0 0 0 4.75" fill="none" stroke="#3B82F6" stroke-width="0.25" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <ellipse cx="1020" cy="40" rx="520" ry="400" fill="url(#ogGlowTR)"/>
  <ellipse cx="120" cy="620" rx="460" ry="360" fill="url(#ogGlowBL)"/>

  <ellipse cx="918" cy="312" rx="400" ry="400" fill="url(#ogCoreHalo)"/>

  <rect width="1200" height="630" fill="url(#ogCanvasGridFine)"/>
  <rect width="1200" height="630" fill="url(#ogCanvasGrid)" opacity="0.55"/>

  <rect width="1200" height="630" fill="url(#ogReadability)"/>
  <rect width="1200" height="630" fill="url(#ogReadabilityV)"/>

  <!-- Global radar rings (atmospheric depth, ties the composition) -->
  <g transform="translate(918, 312)" opacity="0.22" fill="none" stroke="#4db2ff">
    <circle r="290" stroke-width="0.9" stroke-dasharray="10 14"/>
    <circle r="252" stroke-width="0.65" opacity="0.85"/>
    <circle r="214" stroke-width="0.55" stroke-dasharray="4 8" opacity="0.75"/>
    <circle r="176" stroke-width="0.45" opacity="0.65"/>
  </g>

