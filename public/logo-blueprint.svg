<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.6 382.3">
  <!-- Default Privacy Logo - Technical Blueprint Illustration -->
  <!-- For marketing materials and brand assets -->
  
  <defs>
    <!-- Glow filter for the main shapes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="gridBlueprint" width="19" height="19" patternUnits="userSpaceOnUse">
      <path d="M 19 0 L 0 0 0 19" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    
    <!-- Fine grid pattern -->
    <pattern id="gridFineBlueprint" width="4.75" height="4.75" patternUnits="userSpaceOnUse">
      <path d="M 4.75 0 L 0 0 0 4.75" fill="none" stroke="#3B82F6" stroke-width="0.25" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Dark background -->
  <rect width="380.6" height="382.3" fill="#0f1117"/>

  <!-- Background grids -->
  <rect width="380.6" height="382.3" fill="url(#gridFineBlueprint)" />
  <rect width="380.6" height="382.3" fill="url(#gridBlueprint)" />

  <!-- Outer rotating construction circles - centered on the circular part of D -->
  <g opacity="0.15">
    <circle cx="176" cy="191" r="200" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4 4"/>
    <circle cx="176" cy="191" r="195" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Main construction circle (matches the inner circular cutout) -->
  <circle cx="176.1" cy="191.2" r="131.3" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Inner construction circles for prohibition symbol -->
  <circle cx="176.1" cy="191.2" r="87.4" fill="none" stroke="#3B82F6" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.35"/>
  <circle cx="176.1" cy="191.2" r="95" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>

  <!-- Center cross axes -->
  <line x1="176.1" y1="0" x2="176.1" y2="382.3" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="191.2" x2="380.6" y2="191.2" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Diagonal guides through center (for prohibition slash) -->
  <line x1="54" y1="69" x2="298" y2="313" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
  <line x1="298" y1="69" x2="54" y2="313" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>

  <!-- D-shape outline -->
  <path 
    d="M170.8,0H0v382.3h171.4c119.8,0,209.2-69.3,209.2-191.4S291.2,0,170.8,0ZM176.1,322.5c-72.5,0-131.3-58.8-131.3-131.3S103.6,59.8,176.1,59.8s131.3,58.8,131.3,131.3-58.8,131.3-131.3,131.3Z"
    fill="none"
    stroke="#3B82F6"
    stroke-width="1.5"
    opacity="0.6"
  />

  <!-- Prohibition symbol shapes with glow -->
  <g filter="url(#glow)">
    <!-- Top-right filled section -->
    <path 
      d="M176.1,103.7c-17.1,0-33.1,5-46.5,13.6l120.4,120.3c8.5-13.4,13.5-29.3,13.5-46.5,0-48.2-39.2-87.4-87.4-87.4Z"
      fill="none"
      stroke="#3B82F6"
      stroke-width="2"
      opacity="0.85"
    />
    
    <!-- Bottom-left filled section -->
    <path 
      d="M176.1,278.6c17.1,0,33.1-5,46.5-13.6l-120.4-120.3c-8.5,13.4-13.5,29.3-13.5,46.5,0,48.2,39.2,87.4,87.4,87.4Z"
      fill="none"
      stroke="#3B82F6"
      stroke-width="2"
      opacity="0.85"
    />
  </g>

  <!-- Construction guides for the D shape corners -->
  <g opacity="0.25">
    <!-- Top-left corner mark -->
    <line x1="-10" y1="0" x2="30" y2="0" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="-10" x2="0" y2="30" stroke="#3B82F6" stroke-width="0.5"/>
    
    <!-- Bottom-left corner mark -->
    <line x1="-10" y1="382.3" x2="30" y2="382.3" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="352" x2="0" y2="392" stroke="#3B82F6" stroke-width="0.5"/>
    
    <!-- Right edge guide at center -->
    <line x1="370" y1="191" x2="390" y2="191" stroke="#3B82F6" stroke-width="0.5"/>
  </g>

  <!-- Anchor points at key positions -->
  <g opacity="0.6">
    <!-- Top of outer circle -->
    <circle cx="176.1" cy="59.8" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="176.1" cy="59.8" r="1.5" fill="#3B82F6"/>
    
    <!-- Bottom of outer circle -->
    <circle cx="176.1" cy="322.5" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="176.1" cy="322.5" r="1.5" fill="#3B82F6"/>
    
    <!-- Left of outer circle -->
    <circle cx="44.8" cy="191.2" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="44.8" cy="191.2" r="1.5" fill="#3B82F6"/>
    
    <!-- Right of outer circle -->
    <circle cx="307.4" cy="191.2" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="307.4" cy="191.2" r="1.5" fill="#3B82F6"/>
  </g>

  <!-- Prohibition symbol anchor points -->
  <g opacity="0.4">
    <!-- Top-left of slash -->
    <circle cx="129.6" cy="117.3" r="3" fill="none" stroke="#3B82F6" stroke-width="1"/>
    
    <!-- Bottom-right of slash -->
    <circle cx="222.6" cy="265" r="3" fill="none" stroke="#3B82F6" stroke-width="1"/>
    
    <!-- Inner circle top -->
    <circle cx="176.1" cy="103.7" r="3" fill="none" stroke="#3B82F6" stroke-width="1"/>
    
    <!-- Inner circle bottom -->
    <circle cx="176.1" cy="278.6" r="3" fill="none" stroke="#3B82F6" stroke-width="1"/>
  </g>

  <!-- Dimension lines -->
  <g opacity="0.3">
    <!-- Horizontal dimension - full width of D -->
    <line x1="0" y1="365" x2="380" y2="365" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="358" x2="0" y2="372" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="380" y1="358" x2="380" y2="372" stroke="#3B82F6" stroke-width="0.5"/>
    
    <!-- Vertical dimension - full height -->
    <line x1="365" y1="0" x2="365" y2="382" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="358" y1="0" x2="372" y2="0" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="358" y1="382" x2="372" y2="382" stroke="#3B82F6" stroke-width="0.5"/>
  </g>

  <!-- Small detail marks at D shape key points -->
  <g opacity="0.35">
    <circle cx="0" cy="0" r="2.5" fill="none" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="0" cy="382.3" r="2.5" fill="none" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="170.8" cy="0" r="2.5" fill="none" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="171.4" cy="382.3" r="2.5" fill="none" stroke="#3B82F6" stroke-width="1"/>
  </g>
</svg>
